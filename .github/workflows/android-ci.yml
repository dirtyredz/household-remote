name: Android CI
on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fast gate
        run: |
          mkdir -p .tmp/test-temp
          export TMPDIR="$GITHUB_WORKSPACE/.tmp/test-temp"
          bash src/android/gradlew -p src/android --no-daemon ktlintCheck testRemoteDebugUnitTest testOwnerDebugUnitTest lintRemoteRelease lintOwnerRelease assembleRemoteDebug assembleOwnerDebug assembleRemoteRelease assembleOwnerRelease bundleRemoteRelease bundleOwnerRelease
          node --test src/household/export.test.mjs src/household/privacy.test.mjs src/android/releases/contract.test.mjs tools/script-run/script-run.test.mjs
          node src/android/icons/generate-icons.mjs --check
          node src/android/releases/signing-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-check-reports
          path: src/android/app/build/reports/

name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: household-android-release
  cancel-in-progress: false
jobs:
  gate:
    uses: ./.github/workflows/android-ci.yml
  release:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Validate tag before checkout
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build unsigned flavors
        run: bash src/android/gradlew -p src/android --no-daemon assembleRemoteRelease assembleOwnerRelease bundleRemoteRelease bundleOwnerRelease -PversionCode="$VERSION_CODE" -PversionName="${RELEASE_TAG#v}"
      - run: node src/android/releases/stage.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-${{ github.ref_name }}
          include-hidden-files: true
          path: .tmp/release-stage/
          if-no-files-found: error
          retention-days: 90
      - name: Create private unsigned draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "Household Remote $RELEASE_TAG (unsigned)" --notes "Unsigned CI artifacts. Run the attended local signing script before public distribution." .tmp/release-stage/*
